name: CI

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            compiler: g++
          - name: Linux Clang
            os: ubuntu-latest
            compiler: clang++
          - name: macOS AppleClang
            os: macos-latest
            compiler: clang++
          - name: Windows MSVC
            os: windows-latest
            compiler: cl

    steps:
      - uses: actions/checkout@v7
        with:
          path: microvm

      - name: Checkout jplcz_microfmt
        uses: actions/checkout@v7
        with:
          repository: jplcz/microfmt
          path: microfmt

      - name: Enable the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        working-directory: microvm
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DJPLCZ_MICROVM_BUILD_TESTS=ON
          -DJPLCZ_MICROVM_BUILD_EXAMPLES=ON

      - name: Build
        working-directory: microvm
        run: cmake --build build --config Release --parallel 2

      - name: Test
        working-directory: microvm
        run: >-
          ctest --test-dir build --build-config Release --output-on-failure
